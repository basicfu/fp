syntax = "proto3";

package fp.v1;

option go_package = "github.com/basicfu/fp/sdk/gen/fp/v1;fpv1";

// UserService 让业务服务端查询、修改用户的个人信息与头像。
//
// 认证方式与 AuthService 相同：metadata 带 fp-app-id 与 fp-app-secret；fp-im 网关凭据不能调用。
//
// 用户全局互通、不与应用关联：任何应用都可以按 user_id 查询、修改任何用户，
// 改了之后所有应用随之变化。接入同一个 fp 的应用彼此是互信的自家应用。
service UserService {
  // GetUser 按 user_id 返回该用户的全部个人信息。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc GetUser(GetUserRequest) returns (UserProfile);
  // UpdateUser 修改昵称、性别，返回改完的完整资料。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateUser(UpdateUserRequest) returns (UserProfile);
  // UpdateAvatar 存一张头像，返回改完的完整资料（其中 avatar_hash 即新头像的哈希）。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateAvatar(UpdateAvatarRequest) returns (UserProfile);
  // GetAvatar 按内容哈希取回头像。
  rpc GetAvatar(GetAvatarRequest) returns (GetAvatarResponse);
  // RequestDeletion 替用户提交注销：账号进入冷静期（PENDING_DELETE），立即撤销他在所有应用、
  // 所有设备上的会话。冷静期内用该账号任意方式登录即撤销注销；期满由 fp 永久删除。
  //
  // 已在冷静期内时幂等：返回原来的 purge_at，不重新计时。
  // FROZEN 回 ACCOUNT_FROZEN、DELETED 回 ACCOUNT_UNAVAILABLE（均为 PERMISSION_DENIED），用户不存在回 USER_NOT_FOUND。
  rpc RequestDeletion(RequestDeletionRequest) returns (RequestDeletionResponse);

  // ---- 账号管理：业务方替已登录用户换绑手机号 / 邮箱、绑定微信、设置密码。----
  //
  // 这些 RPC 不认 token，只认 user_id：「这个人是不是已登录、改的是不是自己」由业务方把关。
  // 用户状态不是 ACTIVE / PENDING_DELETE 时一律拒绝：FROZEN 回 ACCOUNT_FROZEN、DELETED 回 ACCOUNT_UNAVAILABLE。

  // SendVerifyCode 给用户发一条验证码，用于换绑、设密码之前的身份校验。
  //
  // target 为空发到该用户当前绑定的同类标识（sms → 手机号，email → 邮箱），没有则 IDENTITY_NOT_FOUND；
  // 非空是要换绑的新标识，已属别的用户回 IDENTITY_TAKEN。频率限制与登录发码共用同一个计数
  //（同一目标 30 秒 1 条、1 小时 5 条、1 天 10 条），超出回 RATE_LIMITED。
  // 短信用通知模板 verify_code，邮件用系统配置 verify_code.email_template（默认 verify_code_email），
  // 模板没配好回 VERIFY_TEMPLATE_UNAVAILABLE、供应商发送失败回 NOTIFY_SEND_FAILED。
  //
  // 码只对这个 user_id 有效，与登录验证码互不相通：发给新手机号的码不能拿去登录，反之亦然。
  rpc SendVerifyCode(SendVerifyCodeRequest) returns (SendVerifyCodeResponse);
  // VerifyCode 校验 SendVerifyCode 发出的码，成功即作废，不改任何资料。码错、过期、超过 5 次尝试一律 CODE_INVALID。
  rpc VerifyCode(VerifyCodeRequest) returns (VerifyCodeResponse);
  // BindIdentity 校验发到新标识的验证码后，把用户的手机号或邮箱换成它（原来的同类标识删掉，没有则新增）。
  // 已属别的用户回 IDENTITY_TAKEN；就是本人当前绑着的那个回 IDENTITY_UNCHANGED（SendVerifyCode 发到新标识时同样先拦）。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc BindIdentity(BindIdentityRequest) returns (UserProfile);
  // UnbindIdentity 删掉用户某一类登录标识。删完没有可登录的方式了回 LAST_IDENTITY，本来就没有回 IDENTITY_NOT_FOUND。
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UnbindIdentity(UnbindIdentityRequest) returns (UserProfile);
  // StartBindOAuth 发起一次扫码，把微信绑定到这个用户上。用法与 AuthService.StartOAuthLogin 完全一样
  //（同一个回调地址、同样的 web / desktop 模式），区别只在结论：不登录，而是挂到 user_id 上。
  // 发起时就绑定了 user_id：取结论时 user_id 对不上、或拿登录的接口来取，一律当作 state / 票据无效。
  rpc StartBindOAuth(StartBindOAuthRequest) returns (StartBindOAuthResponse);
  // PollBindOAuth 是桌面端按 state 轮询，同 PollOAuthLogin，只对以 desktop 轮询方式发起的 state 有效。
  rpc PollBindOAuth(PollBindOAuthRequest) returns (PollBindOAuthResponse);
  // ExchangeBindOAuthTicket 用回调交付的一次性 fpTicket 换结论（web 模式、桌面自定义协议），同 ExchangeOAuthTicket。
  rpc ExchangeBindOAuthTicket(ExchangeBindOAuthTicketRequest) returns (ExchangeBindOAuthTicketResponse);
  // SetPassword 设置或重置密码。长度 8 个字符起、72 字节封顶（bcrypt 上限），
  // 否则 PASSWORD_TOO_SHORT / PASSWORD_TOO_LONG；更严的规则（字符种类、32 位上限等）由业务方自己校验。
  //
  // 不撤销任何会话：业务方通常是先用 VerifyCode 校验过本人，再在当前登录态下改密。
  rpc SetPassword(SetPasswordRequest) returns (SetPasswordResponse);
}

// UserProfile 是一个用户的全部个人信息。
//
// 密码哈希与第三方凭据永不出现在这里，只给 has_password。
message UserProfile {
  string id = 1;
  string nickname = 2;
  // avatar_hash 是存在 fp 里的头像的内容哈希（图片原始字节 SHA-256 的前 16 字节，32 位十六进制），
  // 没有头像时为空。换头像即换哈希，所以按哈希取到的内容永不变化，可以无限期缓存。
  //
  // 业务方的规则只有一条：avatar_hash 非空用它，否则用 avatar_url，都空就显示默认头像。
  string avatar_hash = 3;
  // avatar_url 留给三方登录带来的外部头像地址。
  string avatar_url = 4;
  // gender 取 MALE / FEMALE，空串表示未设置。
  string gender = 5;
  // status 取值见服务端 domain.UserStatus*。
  string status = 6;
  bool has_password = 7;
  repeated UserIdentity identities = 8;
  // created_at / updated_at 是 unix 毫秒。
  int64 created_at = 9;
  int64 updated_at = 10;
  // registered_app_id 是注册来源应用的对外 app_id，仅供展示与统计。
  // 管理员手动建的号、或来源应用已被删除时为空。
  string registered_app_id = 11;
}

// UserIdentity 是用户的一个登录标识。
message UserIdentity {
  // type 取 phone / username / email / wechat_mp。
  string type = 1;
  // subject 是完整值，不脱敏：调用方是受信任的业务服务端，要不要对终端用户脱敏由业务方决定。
  string subject = 2;
  // last_login_at 是 unix 毫秒，0 表示从未用它登录。
  int64 last_login_at = 3;
}

message GetUserRequest {
  string user_id = 1;
}

// UpdateUserRequest 里没带的字段不改。
message UpdateUserRequest {
  string user_id = 1;
  // nickname 去首尾空白后须为 1–32 个字符，不含控制字符与换行，否则 NICKNAME_INVALID。
  optional string nickname = 2;
  // gender 取 MALE / FEMALE，空串表示清空，其余取值 INVALID_ARGUMENT。
  optional string gender = 3;
}

message UpdateAvatarRequest {
  string user_id = 1;
  // image 是图片的原始字节，fp 只存不处理（不解码、不裁剪、不压缩）。
  // 上限 1 MB，按文件头只接受 JPEG / PNG / WebP，否则 AVATAR_INVALID。为空表示清除头像。
  bytes image = 2;
}

message GetAvatarRequest {
  string hash = 1;
}

message GetAvatarResponse {
  bytes image = 1;
  // content_type 是存入时按文件头识别出的类型：image/jpeg、image/png 或 image/webp。
  string content_type = 2;
  // url 非空表示头像在对象存储上，此时 image 为空，按它取图（如 302 过去）。
  string url = 3;
}

message RequestDeletionRequest {
  string user_id = 1;
}

message RequestDeletionResponse {
  // purge_at 是预计永久删除的时间（提交时间 + 冷静期），unix 毫秒。
  // 清理任务按小时跑，实际删除会晚于这个时间至多一个周期。
  int64 purge_at = 1;
}

message SendVerifyCodeRequest {
  string user_id = 1;
  // channel 取 sms / email，其余取值 INVALID_ARGUMENT。
  string channel = 2;
  // target 是要发到的手机号 / 邮箱，空表示发到当前绑定的那个。
  // 手机号须为 11 位中国大陆号码（否则 PHONE_INVALID），邮箱格式不对回 INVALID_ARGUMENT。
  string target = 3;
}

message SendVerifyCodeResponse {}

message VerifyCodeRequest {
  string user_id = 1;
  // channel、target 同 SendVerifyCodeRequest：校验的是发到这个目标的那个码。
  string channel = 2;
  string target = 3;
  string code = 4;
}

message VerifyCodeResponse {}

message BindIdentityRequest {
  string user_id = 1;
  // type 取 phone / email，其余取值 INVALID_ARGUMENT。
  string type = 2;
  // subject 是新的手机号 / 邮箱，code 是用 SendVerifyCode 发到它的验证码（phone 对应 channel sms）。
  string subject = 3;
  string code = 4;
}

message UnbindIdentityRequest {
  string user_id = 1;
  // type 取 phone / email / wechat。wechat 一次删掉全部微信身份（网站应用、移动应用、服务号 openid，
  // 以及同一 unionId 下的其它身份）——只删一种的话，下次靠 unionId 又会归并回来。
  // 服务号的通知订阅不受影响，关通知用 NotifyService.UnbindWechat。
  //
  // 「可登录」指：还剩手机号或微信，或者还剩邮箱 / 用户名且设过密码。
  string type = 2;
}

message StartBindOAuthRequest {
  string user_id = 1;
  // connector_type、mode、return_url 同 StartOAuthLoginRequest。
  string connector_type = 2;
  string mode = 3;
  string return_url = 4;
}

// StartBindOAuthResponse 同 StartOAuthLoginResponse。
message StartBindOAuthResponse {
  string state = 1;
  string auth_url = 2;
  string provider_app_id = 3;
  string redirect_uri = 4;
  int64 expires_in_sec = 5;
}

// BindOAuthResult 是绑微信的结论。
//
// 微信已属别的用户不在这里表达，而是整个 RPC 回 IDENTITY_TAKEN（与换绑手机号、邮箱同一个码）；
// state / 票据无效回 OAUTH_STATE_INVALID / OAUTH_TICKET_INVALID。
message BindOAuthResult {
  // status 取 SUCCESS / PENDING / CANCELLED / FAILED（没有 BIND_PHONE）。
  string status = 1;
  // user 仅 SUCCESS：绑完的完整资料。
  UserProfile user = 2;
  // nickname、avatar_url 仅 SUCCESS：本次扫码的微信昵称与头像地址。fp 不存它们，要展示请业务方自己存。
  string nickname = 3;
  string avatar_url = 4;
}

message PollBindOAuthRequest {
  string user_id = 1;
  string state = 2;
}

message PollBindOAuthResponse {
  BindOAuthResult result = 1;
}

message ExchangeBindOAuthTicketRequest {
  string user_id = 1;
  string ticket = 2;
}

message ExchangeBindOAuthTicketResponse {
  BindOAuthResult result = 1;
}

message SetPasswordRequest {
  string user_id = 1;
  string password = 2;
}

message SetPasswordResponse {}
