syntax = "proto3";

package fp.v1;

import "fp/v1/common.proto";

option go_package = "github.com/basicfu/fp/sdk/gen/fp/v1;fpv1";

// AuthService 是 SDK 与 fp 之间的全部认证契约。
//
// 认证方式：每个 RPC 的 metadata 必须带 fp-app-id 与 fp-app-secret，
// 由服务端拦截器校验（见 internal/grpcapi/auth_interceptor.go）。
service AuthService {
  // SendLoginCode 给手机号发送登录验证码。
  rpc SendLoginCode(SendLoginCodeRequest) returns (SendLoginCodeResponse);

  // Login 用某种登录方式的凭据换取会话 token。
  rpc Login(LoginRequest) returns (LoginResponse);

  // StartOAuthLogin 发起一次三方扫码登录（微信网站应用等），返回授权页地址。
  // 用法见 docs/wechat-login.md。
  rpc StartOAuthLogin(StartOAuthLoginRequest) returns (StartOAuthLoginResponse);

  // ExchangeOAuthTicket 用回调交付的一次性 fpTicket 换结论（网页端、桌面端自定义协议）。
  rpc ExchangeOAuthTicket(ExchangeOAuthTicketRequest) returns (ExchangeOAuthTicketResponse);

  // PollOAuthLogin 是桌面端按 state 轮询，只对应用开启了轮询时以 desktop 模式发起的 state 有效。
  rpc PollOAuthLogin(PollOAuthLoginRequest) returns (PollOAuthLoginResponse);

  // ExchangeAppCode 用移动 App 经三方 SDK（微信 OpenSDK 等）拿到的 code 换结论，结论同 ExchangeOAuthTicket。
  // 只接受 App 登录方式（如 "wechat_app"）；网页扫码的 code 必须经 fp 回调，不能直接提交。
  rpc ExchangeAppCode(ExchangeAppCodeRequest) returns (ExchangeAppCodeResponse);

  // BindPhoneLogin 用绑手机票据加短信验证码完成首次扫码登录。发码用 SendLoginCode。
  rpc BindPhoneLogin(BindPhoneLoginRequest) returns (BindPhoneLoginResponse);

  // Logout 撤销一个 token。
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // RevokeSession 按会话 id 撤销一个会话（如业务方「移除这台设备」）。被撤销的 token 再校验得到 KICKED，
  // 而不是 TOKEN_INVALID，客户端据此提示「已被移出账号」。
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  // ValidateToken 是 SDK 回源校验的入口。
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // Watch 是撤销事件的推送流。
  //
  // 它同时承担第二个职责：让这条 gRPC 连接**永不空闲**。
  // 一元 RPC 与本流复用同一条 TCP 连接，流长期存在意味着
  // 回源永远走热连接，不会付 2–5ms 的冷连接代价。
  rpc Watch(stream WatchRequest) returns (stream WatchResponse);

  // ReportPermissions 由业务方 SDK 在启动时调用，上报自己的权限点全量快照。
  // 这是"权限路径从代码变成注册数据"的入口。
  rpc ReportPermissions(ReportPermissionsRequest) returns (ReportPermissionsResponse);

  // GetPolicy 拉取本应用的完整策略快照。SDK 启动时调一次，
  // 之后靠 Watch 上的 PolicyChanged 事件触发重拉。
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);

  // GetAccessKey 取一把访问密钥的校验材料（含 SK）。SDK 本地缓存未命中时调用。
  rpc GetAccessKey(GetAccessKeyRequest) returns (GetAccessKeyResponse);

  // ReportAccessKeyUsage 批量上报签名校验通过的时间，fp 据此更新最后使用时间。
  rpc ReportAccessKeyUsage(ReportAccessKeyUsageRequest) returns (ReportAccessKeyUsageResponse);
}

// SendLoginCodeRequest 是一次发码请求。
message SendLoginCodeRequest {
  // phone 是接收验证码的手机号。
  string phone = 1;
}

// SendLoginCodeResponse 是发码结果。成功即空响应，失败走 gRPC status。
message SendLoginCodeResponse {}

// LoginRequest 是一次登录请求。
message LoginRequest {
  // connector_type 是登录方式，例如 "password" / "sms_code"。
  string connector_type = 1;
  // credentials 是该登录方式所需的凭据，键名由各 connector 定义。
  map<string, string> credentials = 2;
  // ip / user_agent 写入登录审计，由业务方从自己的请求里取。
  string ip = 3;
  string user_agent = 4;
  // mobile 决定适用哪一档空闲超时。
  bool mobile = 5;
  // device_pub（32 字节公钥的 hex，64 个字符，别的写法回 INVALID_ARGUMENT）与 client_ref 刻进会话：
  // 应用开了会话绑定设备时，之后每次请求按 device_pub 验签，
  // client_ref 是应用侧的设备 id，随 ValidateToken 带回。不绑设备的应用不填。
  string device_pub = 6;
  string client_ref = 7;
}

// LoginResponse 是登录成功的结果。
message LoginResponse {
  // token 是签发的 opaque token。
  string token = 1;
  // user 是登录用户的基本资料。
  UserInfo user = 2;
  // session_id 是会话标识，token 轮换时不变。
  string session_id = 3;
}

// StartOAuthLoginRequest 是一次扫码登录的发起。
message StartOAuthLoginRequest {
  // connector_type 是扫码登录方式，例如 "wechat_web"。
  string connector_type = 1;
  // mode 取 "web"（网页、桌面内嵌 webview）或 "desktop"（桌面 App 拉起系统浏览器）。
  string mode = 2;
  // return_url 仅 web 模式：登录完成后浏览器回到的业务页面，必须在该登录方式的回跳白名单里。
  string return_url = 3;
}

// StartOAuthLoginResponse 是发起结果。跳转 auth_url，或拿后三项嵌入官方登录组件。
message StartOAuthLoginResponse {
  string state = 1;
  string auth_url = 2;
  // provider_app_id 是三方平台上的应用标识（微信 AppID）。
  string provider_app_id = 3;
  string redirect_uri = 4;
  int64 expires_in_sec = 5;
}

// OAuthLoginResult 是换票据 / 轮询的结论。
message OAuthLoginResult {
  // status 取 SUCCESS / BIND_PHONE / PENDING / CANCELLED / FAILED。
  // 用字符串而不是 enum：将来新增结论时老 SDK 能原样透传。
  string status = 1;
  // login 仅 SUCCESS。
  LoginResponse login = 2;
  // bind_ticket、nickname、avatar_url 仅 BIND_PHONE：昵称头像供绑手机页面展示。
  string bind_ticket = 3;
  string nickname = 4;
  string avatar_url = 5;
}

// ExchangeOAuthTicketRequest 用 fpTicket 换结论。ip / user_agent / mobile 同 LoginRequest。
message ExchangeOAuthTicketRequest {
  string ticket = 1;
  string ip = 2;
  string user_agent = 3;
  bool mobile = 4;
  // device_pub / client_ref 同 LoginRequest。
  string device_pub = 5;
  string client_ref = 6;
}

// ExchangeOAuthTicketResponse 是换票据结果。
message ExchangeOAuthTicketResponse {
  OAuthLoginResult result = 1;
}

// PollOAuthLoginRequest 按 state 轮询。ip / user_agent / mobile 同 LoginRequest。
message PollOAuthLoginRequest {
  string state = 1;
  string ip = 2;
  string user_agent = 3;
  bool mobile = 4;
  // device_pub / client_ref 同 LoginRequest。
  string device_pub = 5;
  string client_ref = 6;
}

// PollOAuthLoginResponse 是轮询结果。
message PollOAuthLoginResponse {
  OAuthLoginResult result = 1;
}

// ExchangeAppCodeRequest 用 App 拿到的 code 换结论。ip / user_agent / mobile 同 LoginRequest。
message ExchangeAppCodeRequest {
  // connector_type 是 App 登录方式，例如 "wechat_app"。
  string connector_type = 1;
  string code = 2;
  string ip = 3;
  string user_agent = 4;
  bool mobile = 5;
  // device_pub / client_ref 同 LoginRequest。
  string device_pub = 6;
  string client_ref = 7;
}

// ExchangeAppCodeResponse 是换 code 的结果。
message ExchangeAppCodeResponse {
  OAuthLoginResult result = 1;
}

// BindPhoneLoginRequest 是一次绑手机登录。ip / user_agent / mobile 同 LoginRequest。
message BindPhoneLoginRequest {
  string bind_ticket = 1;
  string phone = 2;
  string code = 3;
  string ip = 4;
  string user_agent = 5;
  bool mobile = 6;
  // device_pub / client_ref 同 LoginRequest。
  string device_pub = 7;
  string client_ref = 8;
}

// BindPhoneLoginResponse 是绑手机登录成功的结果。
message BindPhoneLoginResponse {
  LoginResponse login = 1;
}

// UserInfo 是用户的基本资料。
//
// 刻意不含手机号/邮箱：登录标识全部落在 identity 上，
// 需要时通过独立接口按 user_id 查询，不在每次登录响应里携带。
message UserInfo {
  string id = 1;
  string nickname = 2;
  string avatar_url = 3;
  string gender = 4;
  // status 取值见服务端 domain.UserStatus*。
  string status = 5;
  // avatar_hash 是存在 fp 里的头像的内容哈希，没有时为空。非空时以它为准，否则用 avatar_url。
  // 取图见 UserService.GetAvatar。
  string avatar_hash = 6;
}

// LogoutRequest 是一次登出请求。
message LogoutRequest {
  string token = 1;
}

// LogoutResponse 是登出结果。重复登出也返回成功。
message LogoutResponse {}

// RevokeSessionRequest 是一次按会话撤销。
message RevokeSessionRequest {
  string user_id = 1;
  // session_id 不属于该用户、或会话已不存在时什么都不做，revoked 为 0。
  string session_id = 2;
  // reason 目前只接受 "kick"。
  string reason = 3;
}

// RevokeSessionResponse 是撤销结果。
message RevokeSessionResponse {
  // revoked 是作废的 token 数：轮换过渡期内一个会话可能有新旧两个。
  int32 revoked = 1;
}

// ValidateTokenRequest 是一次回源校验。
message ValidateTokenRequest {
  string token = 1;
}

// ValidateTokenResponse 是校验结果。
//
// 刻意不返回过期时刻：SDK 永远不判断 token 是否过期，只遵守 cache_ttl_ms
// （设计文档 4.5.1）。返回 expiry 会让"一处延期、另一处按旧 expiry 误判"
// 的竞态重新出现。
message ValidateTokenResponse {
  string user_id = 1;
  // session_id 是会话标识，token 轮换时不变。撤销以它为单位。
  string session_id = 2;

  // cache_ttl_ms 是 SDK 可以缓存本次判定的毫秒数，
  // 等于 min(应用配置的 token_cache_ttl, token 剩余有效期)。
  //
  // 0 表示**不要缓存**，不是"未设置、用默认值"。会话剩余不足一毫秒时
  // 服务端就会算出 0。proto3 的隐式存在性让"缺省"与"显式 0"在线上不可区分，
  // 这恰好使"不缓存"成为唯一可表达的行为——任何"没给就套本地默认值"的
  // 实现都是在无中生有。
  //
  // 用毫秒而非秒：它在服务端是 time.Duration，可能是亚秒。用秒会把 800ms
  // 进位成 1s，重新引入 min() 本来要防的过度缓存。
  int64 cache_ttl_ms = 3;

  // rotated 为 true 时 new_token 非空，**必须**把它回传给客户端。
  //
  // 不回传的后果：该会话在过渡期（默认 30 秒）结束后被登出，
  // 哪怕它的 max_lifetime 还有 90 天。
  bool rotated = 4;
  string new_token = 5;

  // roles 是该用户在本应用的**有效角色**（全局角色 ∪ 应用默认角色），
  // 在签发会话时解析好刻进会话，随每次校验一起回来。
  //
  // 这样 SDK 的鉴权判定完全不碰网络：本地只需一份很小的策略表（角色 →
  // 权限点），用户的角色跟着身份一起来。把 casbin 的 g 规则（用户 → 角色）
  // 全量下发给每个 SDK 实例是不现实的——它随用户数增长。
  repeated string roles = 6;

  // client_ref / device_pub 是登录时刻进会话的设备信息，没绑设备的会话为空。
  // 业务方用 client_ref 核对「这个 token 是不是这台设备的」。
  string client_ref = 7;
  string device_pub = 8;
}

// WatchRequest 是客户端在 Watch 流上发的消息。应用身份来自 metadata，不在消息体里重复。
//
// 什么都不发的老 SDK 照旧只收广播类事件（撤销、配置变更等）。
message WatchRequest {
  oneof msg {
    // hello 声明本流能处理的能力，建流后发一次。
    WatchHello hello = 1;
    // ack 确认已处理完的业务事件。
    EventAck ack = 2;
    // reply 回答一次登录校验（WatchResponse.login_check）。
    LoginCheckReply reply = 3;
  }
}

// WatchHello 是能力声明。
message WatchHello {
  // caps 取 "app_events"（收业务事件并确认）、"login_check"（回答登录校验）。不认识的能力服务端忽略。
  repeated string caps = 1;
}

// EventAck 确认一批业务事件，ids 是 AppEvent.id。
message EventAck {
  repeated string ids = 1;
}

// LoginCheck 是登录前 fp 同步问应用「这台设备能不能登录」，只发给 hello 里声明了 "login_check" 的流。
//
// 应用须在 3 秒内经同一条流回 LoginCheckReply，超时按登录失败处理。
message LoginCheck {
  string call_id = 1;
  // device_header 是客户端设备头原文（应用配置的请求头），由应用自己解析。
  string device_header = 2;
  string ip = 3;
}

// LoginCheckReply 是应用对 LoginCheck 的回答。
message LoginCheckReply {
  string call_id = 1;
  bool allow = 2;
  // client_ref 是应用给这台设备的标识，放行时必填，刻进会话、随 ValidateToken 带回。
  string client_ref = 3;
  // code / msg 仅拒绝时：原样作为登录错误返回给客户端（如 version_too_low）。
  string code = 4;
  string msg = 5;
}

// AppEvent 是一条业务事件（登录成功、退出登录、账号删除、微信订阅变化）。
//
// 与其它推送不同，它持久化在 fp、要确认：一条事件只投给本应用的一条流，确认前会重投
// （10 秒没确认就换流重投），断线重连后补发。业务方按 id 幂等处理。
message AppEvent {
  string id = 1;
  // seq 是本应用内递增的序号。同一用户的事件按 seq 先后到达（换流重投时可能少量乱序）。
  int64 seq = 2;
  // kind 取 login_succeeded / logged_out / account_deleted / wechat_subscription，
  // 用字符串而不是 enum：新增种类时老 SDK 能原样透传。
  string kind = 3;
  string user_id = 4;
  // payload 是该种类的 JSON 内容。
  bytes payload = 5;
  int64 created_at_ms = 6;
}

// WatchResponse 是一条推送事件。
//
// 用 oneof 是为了将来加 ConfigChanged / PolicyChanged 时不破坏兼容：
// 旧 SDK 遇到不认识的分支会落到 default，忽略即可。
message WatchResponse {
  oneof event {
    // revoke 是一次撤销。
    RevokeEvent revoke = 1;
    // ready 表示服务端已完成订阅，此后的撤销不会漏推。
    WatchReady ready = 2;
    // purge 要求 SDK 丢弃全部缓存。
    WatchPurge purge = 3;
    // policy_changed 表示本应用的策略变了（改角色、改角色权限、删权限点），
    // SDK 应当重拉一次 GetPolicy。
    PolicyChanged policy_changed = 4;
    // user_role_changed 表示某个用户的角色变了，SDK 应当丢掉他的缓存。
    //
    // 与 RevokeEvent 的语义相反：撤销是**拒绝**（用户被踢下线），角色变更
    // 只是**刷新**——给某人加个权限不该把他踢下线。
    UserRoleChanged user_role_changed = 5;
    // config_changed 表示某个分区的配置变了，SDK 应当重拉。
    ConfigChanged config_changed = 6;
    // app_im_config_changed 表示某个应用的 IM 接入配置变了，fp-im 应当重拉
    // 一次 GetAppIMConfig。只有 fp-caller-type: im 的流会收到。
    AppIMConfigChanged app_im_config_changed = 7;
    // access_key_changed 表示某把访问密钥被修改、停用或删除，SDK 应丢掉它的缓存。
    AccessKeyChanged access_key_changed = 8;
    // wechat_subscription_changed 表示某个用户的微信通知状态可能变了。fp-im 的流不会收到。
    WechatSubscriptionChanged wechat_subscription_changed = 9;
    // app_event 是一条要确认的业务事件，只发给 hello 里声明了 "app_events" 的流。
    AppEvent app_event = 10;
    // login_check 是一次登录校验，只发给 hello 里声明了 "login_check" 的流。
    LoginCheck login_check = 11;
  }
}

// WechatSubscriptionChanged 是一次微信通知状态变化的通知，推给该用户登录过的应用和发起扫码的应用。
//
// 触发：扫订阅码开启、按 unionId 自动开启、关注 / 取关服务号、DeleteWechatSubscription。
// 状态没变也可能推（重复的关注事件、关掉本来就没开的通知），业务方按幂等处理。
// 断线期间的变化不补推：重连后收到 ready（或 purge）时，需要准确状态的请自行 GetWechatSubscription。
message WechatSubscriptionChanged {
  string user_id = 1;
  // subscribed 是发布那一刻 GetWechatSubscription 的 bound && subscribed，即「现在收不收得到通知」。
  bool subscribed = 2;
  // at_ms 是发布时间，同一用户收到多条时以最大的为准。
  int64 at_ms = 3;
}

// AppIMConfigChanged 是一次 IM 接入配置变更的通知。
//
// 只推信号不推内容，与 ConfigChanged / PolicyChanged 同一范式：fp-im 收到
// 后重拉全量。它替掉了 fp-im 早期那套"每 10 秒看一次 apps 文件 mtime"的
// 轮询。
message AppIMConfigChanged {
  string app_id = 1;
}

message PolicyChanged {
  // version 是新的策略版本号，SDK 可用它跳过已经拿到的版本。
  int64 version = 1;
}

message UserRoleChanged {
  string user_id = 1;
}

// WatchReady 表示服务端已就绪。
//
// 它存在的意义：SDK 只有收到 ready 才能把"推送通道健康"置为 true。
// 光靠"建流没报错"是不够的——流建立了但服务端还没订上 Redis 的那段时间里，
// 撤销事件会丢，而 SDK 却以为推送可用，不会收紧缓存窗口。
message WatchReady {}

// WatchPurge 要求 SDK 丢弃**全部**缓存条目。
//
// fp 在确知自己漏读了撤销事件、却不知道漏了哪些时发出。目前唯一的触发源是
// Redis 订阅重建（见 internal/store/revoke.go 的 RevokeSignalGap）：go-redis
// 会静默重连并重发 SUBSCRIBE，那个窗口里发布的事件对本实例永久丢失。
//
// **这是悲观判断，不是确知。** 重建时未必真的丢了东西——那个窗口里可能压根
// 没人发布过撤销。但 fp 无从分辨，只能按最坏情况处理。不要试图把它"优化"成
// 条件触发：能让它变成条件的那个信息并不存在。
message WatchPurge {
  // reason 只用于日志与排障，SDK 的处理动作与它无关。
  string reason = 1;
}

// ---------------------------------------------------------------------------
// 授权
// ---------------------------------------------------------------------------

message ReportPermissionsRequest {
  // points 是本次的**全量快照**。
  //
  // 快照里没有的权限点**不会被删除**——"消失"的判据是"多久没有任何实例
  // 报过它"，不是"这次快照里有没有"。业务服务多半多实例，滚动发布时新旧
  // 版本同时在跑，按快照删除会让权限点在两个状态间反复横跳，还会连带删掉
  // 授权关系。
  repeated PermissionPoint points = 1;
}

message PermissionPoint {
  // key 形如 "GET:/orders/{id}"，由**匹配到的路由模式**推导，不是原始 URL。
  string key = 1;
  // kind：api / menu / button。本期恒为 "api"。
  string kind = 2;
  // parent 是父权限点的 key（不是 id，SDK 不知道 id）。本期恒为空。
  string parent = 3;
  // name 是显示名，可选。只在权限点首次创建时写入，之后人在控制台维护，
  // 后续上报不覆盖——否则每次重启，运营填的中文名就没了。
  string name = 4;
}

message ReportPermissionsResponse {}

message GetPolicyRequest {}

message GetPolicyResponse {
  AppPolicy policy = 1;
}

// ConfigChanged 是一次配置变更的通知。
//
// 只推信号不推内容：SDK 收到后拉全量。配置项就几十条，拉全量比处理增量的
// 乱序、丢失、部分应用简单得多——与 PolicyChanged 同一范式。
message ConfigChanged {
  // type 指出哪个分区变了。一次保存只动一个分区（版本序列是分区内自增的），
  // 所以正常情况下这里是单值。
  //
  // **空串表示"分区未知，请重拉全部绑定"**：fp 侧的 Redis 订阅重建时会漏读
  // 事件且不知道漏了哪些（见 store.ConfigSignal.Gap），只能让 SDK 全部重拉。
  // 这是配置侧对应 WatchPurge 的那条兜底，只是配置不需要"丢弃全部"。
  string type = 1;
  // version 仅用于日志与排障。SDK 拉的是"当前版本"而不是"第 version 版"——
  // 这让丢失一条通知的后果被下一条自动修复。
  int64 version = 2;
}

message AccessKeyChanged {
  string access_key_id = 1;
}

message GetAccessKeyRequest {
  string access_key_id = 1;
}

message GetAccessKeyResponse {
  string secret = 1;
  string remark = 2;
  // roles 是绑定的角色，当前 0 或 1 个。
  repeated string roles = 3;
  // allowed_ips 是 IP 白名单（CIDR），空表示不校验。
  repeated string allowed_ips = 4;
  // cache_ttl_ms = min(应用的 token_cache_ttl, 到期剩余时间)，0 表示不缓存。
  int64 cache_ttl_ms = 5;
}

message ReportAccessKeyUsageRequest {
  repeated AccessKeyUsage usages = 1;
}

message AccessKeyUsage {
  string access_key_id = 1;
  int64 last_used_at_ms = 2;
}

message ReportAccessKeyUsageResponse {}
